[project]
name = "enclave-envoy"
version = "0.1.0"
description = "Securely sync dotfiles across devices via AWS S3 + KMS envelope encryption"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "cryptography>=42.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
enclave = "enclave.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["enclave*"]
